[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbohaul-manager"
version = "0.0.1"
description = "Ollama-shape inference manager using TurboQuant llama.cpp - fleet-internal local inference one-stop-shop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PL Claude (claude-pl)", email = "pl-claude@contak.local" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "websockets>=13.0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.7.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
turbohaul-manager = "turbohaul.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["turbohaul"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S104", # tests cover 0.0.0.0 bind-guard behavior
  "S108", # SSRF/safety tests use hardcoded /tmp paths as hostile input
  "S603", # subprocess in tests is controlled
  "F841", # fixture/scaffold locals not always consumed
  "E402", # late imports for monkeypatch ordering
  "E501", # long literals in test data
  "B007", # loop iter vars used only for counting
]
