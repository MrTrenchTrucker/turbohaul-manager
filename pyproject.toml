[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbohaul-manager"
version = "0.8.0"
description = "Ollama-shape inference manager using TurboQuant llama.cpp - local inference one-stop-shop"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MrTrenchTrucker"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "jsonschema==4.21.1",
    "websockets>=13.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]
# MLX backend support (Apple Silicon only). mlx-lm provides the
# `python -m mlx_lm server` runner used by the turbohaul MLX backend.
mlx = [
    "mlx-lm>=0.21.0",
]

[project.scripts]
turbohaul-manager = "turbohaul.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Pin `import turbohaul` to THIS checkout's src/ (pytest>=7 built-in
# pythonpath plugin inserts rootpath/src at the front of sys.path). Without
# this, a foreign importable turbohaul elsewhere on the host shadows the
# checkout under test.
# The shared test fixture lives in tests/ and is imported BY NAME from more
# than one suite, so tests/ must be importable. "src" stays FIRST so the pin
# above still wins for `import turbohaul`.
pythonpath = ["src", "tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "e2e: real-engine end-to-end test (needs Apple Silicon + MLX_E2E=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A"]
ignore = ["S101"]  # assert is fine in tests
