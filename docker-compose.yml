# Turbohaul-Manager reference docker-compose.
#
# Builds the self-contained image from source (Dockerfile.engine-src, the TurboQuant
# engine compiled in-repo -- no external registry, PyPI, npm, or binary mount).
# Just: docker compose up -d --build

services:
  turbohaul-manager:
    build:
      context: .
      dockerfile: Dockerfile.engine-src
    image: turbohaul-manager:v0.6.0
    container_name: turbohaul-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:11401:11401"  # bound to loopback by default; remove the 127.0.0.1: prefix only with an explicit network policy
    volumes:
      - turbohaul-state:/var/lib/turbohaul
      # Optional: override the shipped default config
      # - ./turbohaul.yaml:/etc/turbohaul/turbohaul.yaml:ro
    environment:
      TURBOHAUL_ALLOW_PUBLIC_BIND: "1"  # required for container -> host port mapping
      TURBOHAUL_LOG_LEVEL: "info"
      # HF_API_KEY:  # set in .env if pulling private HF models
    # NVIDIA GPU access (the TurboQuant engine uses CUDA).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  turbohaul-state:
    name: turbohaul-state
